<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Madecentro · Soporte IMOS</title>
  <link rel="stylesheet" href="css/styles.css?v=20260812a" />
</head>
<body>
  <div class="login-screen">
    <div class="login-card">
      <div class="badge">M</div>
      <h1>Soporte IMOS</h1>
      <p>Ingresá tu nombre y correo para crear o consultar casos. No hace falta contraseña.</p>
      <div id="alert-box"></div>
      <form id="form-login">
        <div class="form-group" style="text-align:left;">
          <label for="nombre">Nombre completo</label>
          <input type="text" id="nombre" required placeholder="Ej: María Gómez" />
        </div>
        <div class="form-group" style="text-align:left;">
          <label for="correo">Correo</label>
          <input type="email" id="correo" required placeholder="tu.correo@madecentro.com" />
        </div>
        <button type="submit" class="btn btn-primary btn-block">Continuar</button>
      </form>
      <p style="margin-top:16px;"><a href="index.html">&larr; Volver</a></p>
    </div>
  </div>

  <script src="js/simpleAuth.js?v=20260812a"></script>
  <script>
    document.getElementById("form-login").addEventListener("submit", (e) => {
      e.preventDefault();
      const nombre = document.getElementById("nombre").value.trim();
      const correo = document.getElementById("correo").value.trim();
      if (!nombre || !correo) return;
      setSimpleUser(nombre, correo);
      window.location.href = "nuevo-caso.html";
    });

    // Si ya había una sesión simple activa, saltar directo.
    (function () {
      const existing = getSimpleUser();
      if (existing) window.location.href = "nuevo-caso.html";
    })();
  </script>
</body>
</html>
