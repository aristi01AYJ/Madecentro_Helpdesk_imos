<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gestionar casos · Soporte IMOS</title>
  <link rel="stylesheet" href="css/styles.css?v=20260814a" />
  <style>
    .caso-manage-form {
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--mc-border);
      display: grid;
      grid-template-columns: 180px 1fr auto;
      gap: 10px;
      align-items: start;
    }
    .caso-manage-form textarea { min-height: 60px; }
    @media (max-width: 720px) {
      .caso-manage-form { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="app-nav"></div>

  <div class="page">
    <div class="page-header">
      <h1>Gestionar casos</h1>
      <p>Actualizá el estado y dejá la solución escrita — al marcar un caso como "Resuelto" o "Cerrado" con solución, queda disponible automáticamente en el Mini Helpdesk.</p>
    </div>

    <div class="toolbar">
      <select id="filtro-cliente">
        <option value="">Todas las empresas</option>
      </select>
      <select id="filtro-estado">
        <option value="">Todos los estados</option>
      </select>
      <input type="text" id="filtro-texto" placeholder="Buscar por asunto o usuario..." />
    </div>

    <div id="alert-box"></div>
    <div id="lista-casos"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@azure/msal-browser@3/lib/msal-browser.min.js"></script>
  <script src="js/config.js?v=20260814a"></script>
  <script src="js/auth.js?v=20260814a"></script>
  <script src="js/graphService.js?v=20260814a"></script>
  <script src="js/nav.js?v=20260814a"></script>
  <script>
    (async function () {
      const account = await requireAuth();
      if (!account) return;
      renderNav(account, "gestionar-casos");

      const filtroCliente = document.getElementById("filtro-cliente");
      filtroCliente.innerHTML += APP_CONFIG.clientes.map((cl) => `<option value="${cl}">${cl}</option>`).join("");

      const filtroEstado = document.getElementById("filtro-estado");
      filtroEstado.innerHTML += APP_CONFIG.estados.map((e) => `<option value="${e}">${e}</option>`).join("");

      const filtroTexto = document.getElementById("filtro-texto");
      const cont = document.getElementById("lista-casos");
      const alertBox = document.getElementById("alert-box");

      let todos = [];

      async function cargar() {
        cont.innerHTML = `<div class="empty-state">Cargando casos...</div>`;
        try {
          todos = await getTodosCasos();
          aplicarFiltros();
        } catch (err) {
          alertBox.innerHTML = `<div class="alert alert-error">No se pudieron cargar los casos: ${err.message}</div>`;
          cont.innerHTML = "";
        }
      }

      function aplicarFiltros() {
        const q = filtroTexto.value.trim().toLowerCase();
        const est = filtroEstado.value;
        const cli = filtroCliente.value;
        const filtrados = todos.filter((c) => {
          const matchEstado = !est || c.estado === est;
          const matchCliente = !cli || c.cliente === cli;
          const matchTexto =
            !q ||
            (c.asunto || "").toLowerCase().includes(q) ||
            (c.creadoPorNombre || "").toLowerCase().includes(q) ||
            (c.creadoPorCorreo || "").toLowerCase().includes(q);
          return matchEstado && matchCliente && matchTexto;
        });

        if (filtrados.length === 0) {
          cont.innerHTML = `<div class="empty-state">No hay casos que coincidan.</div>`;
          return;
        }
        cont.innerHTML = filtrados.map(renderCaso).join("");
        filtrados.forEach(attachHandlers);
      }

      function renderCaso(c) {
        const estadoClass = "badge-" + c.estado.replace(/\s+/g, "");
        return `
          <div class="caso-item" data-id="${c.id}">
            <div class="caso-item-head">
              <div>
                <h3>${c.asunto}</h3>
                <div class="caso-meta">${c.cliente ? "<strong>" + c.cliente + "</strong> · " : ""}#${c.id} · ${c.creadoPorNombre} (${c.creadoPorCorreo}) · Abierto: ${new Date(c.fechaApertura || c.fechaCreacion).toLocaleDateString("es-CO")}${c.fechaCierre ? " · Cerrado: " + new Date(c.fechaCierre).toLocaleDateString("es-CO") : ""}${c.tiempoUsadoHoras ? " · " + c.tiempoUsadoHoras + "h usadas" : ""}${c.synergyId ? " · Synergy: " + c.synergyId : ""}</div>
              </div>
              <span class="badge-pill ${estadoClass}">${c.estado}</span>
            </div>
            <div class="caso-desc">${c.descripcion || ""}</div>
            ${c.adjuntos && c.adjuntos.length > 0 ? `<div style="font-size:13px;margin-bottom:8px;">📎 Adjunto del caso: ${c.adjuntos.map((u) => `<a href="${u}" target="_blank" rel="noopener">Ver archivo</a>`).join(", ")}</div>` : ""}
            ${c.adjuntosSolucion && c.adjuntosSolucion.length > 0 ? `<div style="font-size:13px;margin-bottom:8px;">📎 Adjunto de la solución: ${c.adjuntosSolucion.map((u) => `<a href="${u}" target="_blank" rel="noopener">Ver archivo</a>`).join(", ")}</div>` : ""}
            <div class="caso-tags">
              <span class="badge-pill badge-${c.urgencia}">Urgencia: ${c.urgencia}</span>
              <span class="badge-pill" style="background:#eceff3;color:#444">${c.categoria}</span>
              <span class="badge-pill" style="background:#eceff3;color:#444">${c.tipoCaso}</span>
            </div>

            <div class="caso-manage-form">
              <select class="input-estado">
                ${APP_CONFIG.estados
                  .map((e) => `<option value="${e}" ${e === c.estado ? "selected" : ""}>${e}</option>`)
                  .join("")}
              </select>
              <textarea class="input-solucion" placeholder="Solución / respuesta dada al usuario...">${c.solucion || ""}</textarea>
              <button class="btn btn-primary btn-sm btn-guardar">Guardar</button>

              <input type="number" step="0.5" min="0" class="input-tiempo" placeholder="Horas usadas" value="${c.tiempoUsadoHoras || ""}" />
              <input type="text" class="input-synergy" placeholder="ID Synergy (opcional)" value="${c.synergyId || ""}" />

              <input type="file" class="input-adjunto-solucion" style="grid-column: 1 / -1;" />
            </div>
            <div class="guardar-msg" style="font-size:12px;margin-top:6px;"></div>
          </div>
        `;
      }

      function attachHandlers(c) {
        const el = cont.querySelector(`.caso-item[data-id="${c.id}"]`);
        if (!el) return;
        const btn = el.querySelector(".btn-guardar");
        const msg = el.querySelector(".guardar-msg");

        btn.addEventListener("click", async () => {
          const nuevoEstado = el.querySelector(".input-estado").value;
          const nuevaSolucion = el.querySelector(".input-solucion").value;
          const nuevoTiempo = el.querySelector(".input-tiempo").value;
          const nuevoSynergy = el.querySelector(".input-synergy").value;
          const archivoSolucion = el.querySelector(".input-adjunto-solucion").files[0];

          const esCierre = nuevoEstado === "Resuelto" || nuevoEstado === "Cerrado";
          const fechaCierre = esCierre && !c.fechaCierre ? new Date().toISOString() : undefined;

          btn.disabled = true;
          btn.textContent = "Guardando...";
          msg.textContent = "";

          try {
            let adjuntosSolucionUrls;
            if (archivoSolucion) {
              btn.textContent = "Subiendo adjunto...";
              const url = await subirAdjuntoSolucion(c.id, archivoSolucion);
              const existentes = c.adjuntosSolucion || [];
              adjuntosSolucionUrls = [...existentes, url].join("\n");
            }

            btn.textContent = "Guardando...";
            await actualizarCaso(c.id, {
              estado: nuevoEstado,
              solucion: nuevaSolucion,
              tiempoUsadoHoras: nuevoTiempo,
              synergyId: nuevoSynergy,
              fechaCierre,
              adjuntosSolucionUrls,
            });
            msg.innerHTML = `<span style="color:var(--mc-success)">Guardado ✓</span>`;
            c.estado = nuevoEstado;
            c.solucion = nuevaSolucion;
            c.tiempoUsadoHoras = nuevoTiempo;
            c.synergyId = nuevoSynergy;
            if (fechaCierre) c.fechaCierre = fechaCierre;
            if (adjuntosSolucionUrls !== undefined) {
              c.adjuntosSolucion = adjuntosSolucionUrls.split("\n").filter(Boolean);
            }
            const badge = el.querySelector(".badge-pill");
            badge.className = "badge-pill badge-" + nuevoEstado.replace(/\s+/g, "");
            badge.textContent = nuevoEstado;
          } catch (err) {
            msg.innerHTML = `<span style="color:var(--mc-danger)">Error: ${err.message}</span>`;
          } finally {
            btn.disabled = false;
            btn.textContent = "Guardar";
          }
        });
      }

      filtroCliente.addEventListener("change", aplicarFiltros);
      filtroEstado.addEventListener("change", aplicarFiltros);
      filtroTexto.addEventListener("input", aplicarFiltros);
      cargar();
    })();
  </script>
</body>
</html>
